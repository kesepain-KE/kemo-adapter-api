name: Version and update safety

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-update-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-and-update:
    name: Version and update (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate release metadata
        run: python -m tests --suite version -q

      - name: Validate the Kemo 2.0 artifact contract
        run: python -m tests --suite kemo-contract -q

      - name: Run public and admin API safety tests
        run: python -m tests --suite api --suite web -q

      - name: Run update unit safety tests
        run: python -m tests --suite update-unit -q

      - name: Run temporary Git repository integration tests
        run: python -m tests --suite update-git -q

      - name: Run execution and persistence safety tests
        run: >-
          python -m tests --suite protocol --suite storage --suite architecture -q

      - name: Check gateway adapters, routing and extensions
        run: >-
          python -m tests --suite gateway -q

      - name: Check the real remote without modifying source
        run: python update.py --check

      - name: Verify UTF-8 Git boundary and source syntax
        run: |
          python -m compileall -q update.py update core api gateway storage web templates tests
          git diff --check
