name: Version and update safety

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-update-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-and-update:
    name: Source tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python:
          - "3.12"
        include:
          - os: ubuntu-latest
            python: "3.11"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run all source tests, including installation and runtime safety
        run: python -m tests -q

      - name: Check the real remote without modifying source
        run: python update.py --check

      - name: Verify UTF-8 Git boundary and source syntax
        run: |
          python -m compileall -q update.py update core api gateway storage web templates tests
          git diff --check
