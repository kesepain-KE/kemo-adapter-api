name: Web restart chain

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-restart-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restart-e2e:
    name: Web restart E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Build Web console
        working-directory: web/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Test real Web restart handoff
        env:
          KEMO_RUN_RESTART_E2E: "1"
        run: python -m pytest tests/test_web_restart_e2e.py -q
